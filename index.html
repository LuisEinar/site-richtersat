<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RichterSat Tecnologia - Catálogo e Soluções</title>
    <style>
        :root {
            --primary-color: #0f172a;
            --accent-color: #2563eb;
            --bg-color: #f8fafc;
            --text-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 2rem 1rem;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            overflow: hidden;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card h3 {
            margin-top: 0.5rem;
            color: var(--primary-color);
        }

        /* Estilo da miniatura do vídeo */
        .video-thumbnail-container {
            position: relative;
            width: 100%;
            cursor: pointer;
            border-radius: 6px;
            overflow: hidden;
            background: #000;
        }

        .video-thumbnail-container video {
            width: 100%;
            display: block;
            max-height: 200px;
            object-fit: cover;
        }

        .zoom-hint {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
            pointer-events: none;
        }

        /* Modal de Zoom do Vídeo */
        .video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .video-modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            max-width: 850px;
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
        }

        .modal-content video {
            width: 100%;
            max-height: 80vh;
            display: block;
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            font-size: 1.5rem;
            padding: 4px 12px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 1010;
        }

        .close-modal:hover {
            background: rgba(255, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <header>
        <h1>RichterSat Tecnologia</h1>
        <p>Soluções em Automação, Energia Solar e Segurança</p>
    </header>

    <main>
        <section class="catalog-grid">
            <!-- Exemplo de Card com o Vídeo -->
            <div class="card">
                <h3>Sistema Abastecedora</h3>
                <div class="video-thumbnail-container" onclick="openVideoZoom()">
                    <video id="thumbVideo" muted loop playsinline>
                        <source src="abastecedora.mp4" type="video/mp4">
                        Seu navegador não suporta vídeos.
                    </video>
                    <div class="zoom-hint">🔍 Ampliar Vídeo</div>
                </div>
                <p>Demonstração operacional do sistema.</p>
            </div>
        </section>
    </main>

    <!-- Modal Ampliado -->
    <div id="videoModal" class="video-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeVideoZoom()">&times;</button>
            <video id="modalVideo" controls>
                <source src="abastecedora.mp4" type="video/mp4">
                Seu navegador não suporta vídeos.
            </video>
        </div>
    </div>

    <script>
        const thumbVideo = document.getElementById('thumbVideo');
        const modalVideo = document.getElementById('modalVideo');
        const videoModal = document.getElementById('videoModal');

        // Opcional: Reproduzir miniatura em loop silencioso ao passar o mouse (hover)
        const container = document.querySelector('.video-thumbnail-container');
        container.addEventListener('mouseenter', () => {
            thumbVideo.play().catch(e => console.log("Autoplay bloqueado pelo navegador", e));
        });
        container.addEventListener('mouseleave', () => {
            thumbVideo.pause();
        });

        function openVideoZoom() {
            // 1. Pausa e cessa totalmente o áudio da miniatura para evitar duplicação
            thumbVideo.pause();
            thumbVideo.muted = true;

            // 2. Abre o modal e inicia o vídeo ampliado com som liberado
            videoModal.classList.add('active');
            modalVideo.currentTime = thumbVideo.currentTime; // Sincroniza o momento atual
            modalVideo.play();
        }

        function closeVideoZoom() {
            // 1. Pausa o vídeo do modal
            modalVideo.pause();
            modalVideo.currentTime = 0;

            // 2. Fecha o modal
            videoModal.classList.remove('active');
        }

        // Fecha também ao clicar fora da área do vídeo no modal
        videoModal.addEventListener('click', (e) => {
            if (e.target === videoModal) {
                closeVideoZoom();
            }
        });
    </script>

</body>
</html>
